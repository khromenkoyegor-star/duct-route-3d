# Збірка й тести на кожен PR; після злиття в main — ті самі тести і публікація на GitHub Pages.
# Скріншоти iPad/iPhone і звіт Playwright — в артефакті «screenshots-and-report» кожного запуску.
#
# На сайті дві версії:
# - https://khromenkoyegor-star.github.io/duct-route-3d/       — стабільна 4.1, НЕЗМІННА: щоразу
#   збирається з одного й того самого коміту (резервна гілка stable-v4.1), а не з main;
# - https://khromenkoyegor-star.github.io/duct-route-3d/next/  — «Траса 3D 2»: main, уся подальша робота.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# На PR новий push скасовує старий прогін; у main — ні, щоб не обірвати публікацію, яка вже йде.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Збірка і тести
    runs-on: ubuntu-latest
    # Повний набір (≈ 550 сценаріїв у WebKit на трьох профілях) іде ≈ 20 хв — із запасом.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Залежності
        run: npm ci

      - name: Збірка (з перевіркою типів)
        run: npm run build

      - name: Тести ядра (Vitest)
        run: npm test

      - name: Браузер WebKit (рушій Safari)
        run: npx playwright install --with-deps webkit

      - name: Сценарії в браузері (Playwright, WebKit)
        run: npm run test:e2e

      - name: Скріншоти й звіт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-and-report
          path: |
            test-results/screenshots/
            playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # Стабільна версія 4.1 — точно той коміт, що був на сайті до розділення (гілка stable-v4.1).
      # Нічого не міняти тут без прохання Єгора: ця адреса має працювати як раніше.
      - name: Стабільна версія 4.1 (незмінна) — на стару адресу
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STABLE_SHA: b934c14186ee85106c62530032c5624658c02832
        run: |
          git fetch --depth=1 origin "$STABLE_SHA"
          git worktree add --detach "$RUNNER_TEMP/stable" "$STABLE_SHA"
          (cd "$RUNNER_TEMP/stable" && npm ci && npm run build)
          mkdir -p "$RUNNER_TEMP/site"
          cp -R "$RUNNER_TEMP/stable/dist/." "$RUNNER_TEMP/site/"
          # Нова версія «Траса 3D 2» (main) — у папку next/.
          cp -R dist "$RUNNER_TEMP/site/next"
          test -f "$RUNNER_TEMP/site/index.html" && test -f "$RUNNER_TEMP/site/next/index.html"

      - name: Зібраний сайт для GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Публікація на GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Публікація
        id: deployment
        uses: actions/deploy-pages@v4
